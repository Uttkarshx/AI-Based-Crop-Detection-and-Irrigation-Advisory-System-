crop:
  name: "maize"
  display_name: "Maize"

  growth_stages:
    - name: "germination"
      order: 1

    - name: "vegetative"
      order: 2

    - name: "reproductive"
      order: 3

    - name: "maturity"
      order: 4

  irrigation:
    soil_moisture_threshold_percent: 30.0

    rainfall:
      low_threshold_mm: 5.0
      high_threshold_mm: 20.0

    temperature:
      high_threshold_celsius: 35.0

    humidity:
      low_threshold_percent: 40.0

  confidence:
    minimum_crop_confidence: 0.70